cutoff_len: 4096
dataset_dir: data
do_predict: true
eval_dataset: test_docci500_small
finetuning_type: lora
flash_attn: disabled
max_new_tokens: 1024
max_samples: 100000

model_name_or_path: saves/qwen2_vl-2b/merged/sft
adapter_name_or_path: saves/qwen2_vl-2b/lora/sc_coco6k_mini_verifier
output_dir: saves/eval_qwen2vl-2b/sc/docci500_mini_verifier

per_device_eval_batch_size: 1
predict_with_generate: true
preprocessing_num_workers: 2
quantization_method: bitsandbytes
stage: sft
temperature: 0.95
template: qwen2_vl
top_p: 0.7
correction_instruction: "The previous response is not very good. Please review the objects, attributes and relations in the caption. Remove that not appear in the image and add missing ones in the previous caption. Directly output the final caption: "
self_correction: True

#### Verifier config
verification_enabled: true
verification_model: yolov8n.pt
verification_threshold: 0.40
explainability_enabled: true