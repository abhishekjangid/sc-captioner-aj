### model
model_name_or_path: saves/qwen2_vl-2b/merged/sft

### method
stage: sc
do_train: true
finetuning_type: lora
lora_target: all
pref_beta: 0.1
pref_loss: sigmoid


### dataset
dataset_dir: data
dataset: train_coco6k_2_mini
template: qwen2_vl
cutoff_len: 1024
max_samples: 1000
overwrite_cache: false
preprocessing_num_workers: 1

### output
output_dir: saves/qwen2_vl-2b/lora/sc_coco6k_mini_baseline
logging_steps: 2
save_steps: 4
plot_loss: true
overwrite_output_dir: true

#### Verifier config
verification_enabled: true
verification_model: yolov8n.pt
verification_threshold: 0.40
verification_penalty_reduction: 1.0
verified_removal_reward_reduction: 1.0
explainability_enabled: true
save_explanation_report: true


### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 5.0e-6
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
fp16: false
bf16: true
ddp_timeout: 180000000

### eval
val_size: 0.0
per_device_eval_batch_size: 1
eval_strategy: "no"